[pytest]
testpaths = src/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Fast deterministic unit tests
    integration: Integration tests for services and repositories
    api: REST API endpoint tests
    agent: Agent routing and trajectory tests
    rag: Vector RAG and retrieval tests
    graphrag: Knowledge graph and GraphRAG tests
    performance: Slow latency and load tests
    evals: LLM output evaluation tests
